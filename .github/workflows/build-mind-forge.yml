name: Build MIND FORGE APK
on:
  push:
    branches: [ mind-forge ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mind-forge-debug-apk
          path: mindforge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
